name: Build Windows EXE

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
     
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2  


      - name: Build MFC Solution
        run: |
          msbuild /m /p:Configuration=Release /p:Platform=x64 IRC.slnx


      - name: Get current time
        id: now
        uses: josStorer/get-current-time@v2
        with:
          timezone: "America/Chicago"
          format: M-D-YY-hh.mm.ss.A
          
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false    
          tag_name: ${{ steps.now.outputs.formattedTime }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ github.workspace }}\x64\Release\IRC.exe
          name: "Release ${{ steps.now.outputs.formattedTime }}"